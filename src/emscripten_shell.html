<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atari ST</title>
<!-- Radio Equinoxe (23/11/2026) : page de l'émulateur, chargée dans un iframe
     derrière le verre du moniteur de la page Captain Blood. Écran seul.
     Dialogue avec la page parente par postMessage :
       envoie  { source: "hatari", type: "hello" }       (prêt à recevoir "boot")
               { source: "hatari", type: "ready" }       (émulateur lancé)
               { source: "hatari", type: "led", drive: 0|1, on: bool }
               { source: "hatari", type: "mouse", captured: bool }
               { source: "hatari", type: "diskData", index: n, changed: bool, data }  (réponse à readDisk)
       reçoit  { target: "hatari", type: "boot", disks: [{ name, data }], insert: n|null, autostart: "A:\\X.PRG"|null }
               { target: "hatari", type: "addDisks", disks: [{ name, data }] }  (ajout à la suite)
               { target: "hatari", type: "insert", index: n }   (changer de disquette)
               { target: "hatari", type: "eject" }
               { target: "hatari", type: "readDisk", index: n, inDrive: bool }
                 (relit le fichier d'une disquette ; si elle est dans le lecteur,
                  l'écrit d'abord sans l'éjecter — disquette de sauvegarde du jeu)
               { target: "hatari", type: "focus" }   (rend le clavier à l'Atari)
     Les disquettes arrivent en mémoire (ArrayBuffer) : rien ne quitte l'appareil. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    cursor: pointer;
    outline: none;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  function tell(msg) {
    msg.source = "hatari";
    if (window.parent !== window) window.parent.postMessage(msg, "*");
  }

  var DISK_DIR = "/disks";
  var diskPaths = [];
  var bootConfig = null;
  var bootWaiter = null;

  function diskPath(i, name) {
    var ext = (String(name).match(/\.([a-z0-9]{2,3})$/i) || [, "st"])[1].toLowerCase();
    return DISK_DIR + "/disk" + (i + 1) + "." + ext;
  }

  // Ajoute des disquettes à la suite de celles déjà connues (index = ordre
  // d'arrivée, identique à la liste de la page parente).
  function writeDisks(disks) {
    try { Module.FS.mkdir(DISK_DIR); } catch (e) {}
    disks.forEach(function (d) {
      var p = diskPath(diskPaths.length, d.name);
      Module.FS.writeFile(p, new Uint8Array(d.data));
      diskPaths.push(p);
    });
  }

  function applyBoot(cfg) {
    writeDisks(cfg.disks || []);
    var args = Module["arguments"];   // même tableau que celui lu par main()
    if (cfg.insert != null && diskPaths[cfg.insert]) {
      args.push("--disk-a", diskPaths[cfg.insert]);
      if (cfg.autostart) args.push("--auto", cfg.autostart);
    }
  }

  var canvas = document.getElementById("canvas");
  var Module = {
    // Le démarrage attend la configuration envoyée par la page parente.
    preRun: [function () {
      if (bootConfig) { applyBoot(bootConfig); return; }
      Module.addRunDependency("boot");
      bootWaiter = function (cfg) {
        applyBoot(cfg);
        Module.removeRunDependency("boot");
      };
    }],
    postRun: [function () { tell({ type: "ready" }); }],
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    canvas: canvas,
    setStatus: function () {},
    onFloppyLed: function (drive, on) { tell({ type: "led", drive: drive, on: !!on }); },
  };

  function ejectA() {
    Module.ccall("Floppy_EjectDiskFromDrive", "number", ["number"], [0]);
  }

  window.addEventListener("message", function (e) {
    var m = e.data;
    if (!m || m.target !== "hatari") return;
    if (m.type === "boot" && !bootConfig) {
      bootConfig = m;
      if (bootWaiter) bootWaiter(m);
      return;
    }
    if (typeof Module.ccall !== "function") return;
    if (m.type === "addDisks" && Array.isArray(m.disks)) {
      writeDisks(m.disks);
    } else if (m.type === "insert" && diskPaths[m.index]) {
      ejectA();
      Module.ccall("Floppy_SetDiskFileName", "number", ["number", "string", "string"], [0, diskPaths[m.index], null]);
      Module.ccall("Floppy_InsertDiskIntoDrive", "number", ["number"], [0]);
    } else if (m.type === "eject") {
      ejectA();
    } else if (m.type === "readDisk" && diskPaths[m.index]) {
      var changed = m.inDrive ? !!Module.ccall("Floppy_FlushDisk", "number", ["number"], [0]) : true;
      var bytes = Module.FS.readFile(diskPaths[m.index]);
      var copy = bytes.slice().buffer;
      window.parent.postMessage({ source: "hatari", type: "diskData", index: m.index, changed: changed, data: copy }, "*", [copy]);
    } else if (m.type === "focus") {
      canvas.focus();
    }
  });

  // Souris : un clic dans l'écran la capture pour l'Atari ; Échap la rend
  // (géré par le navigateur). Échap n'est PAS transmis à l'Atari.
  canvas.addEventListener("click", function () {
    canvas.focus();
    if (document.pointerLockElement !== canvas && canvas.requestPointerLock) canvas.requestPointerLock();
  });
  document.addEventListener("pointerlockchange", function () {
    tell({ type: "mouse", captured: document.pointerLockElement === canvas });
  });
  ["keydown", "keyup"].forEach(function (ev) {
    window.addEventListener(ev, function (e) {
      if (e.key === "Escape") e.stopImmediatePropagation();
    }, true);
  });

  tell({ type: "hello" });
</script>
{{{ SCRIPT }}}
</body>
</html>
